[package]
name = "clearwave"
version = "0.6.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/NullMagic2/Clearwave"
rust-version = "1.88"
description = "Native model loading and portable GPU compute for voice processing"

[dependencies]
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wgpu = { version = "=25.0.2", default-features = false, features = ["vulkan", "wgsl"] }
pollster = "=0.4.0"
bytemuck = "=1.25.2"
nix = { version = "=0.31.3", features = ["signal", "poll"] }

gtk = "=0.18.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
