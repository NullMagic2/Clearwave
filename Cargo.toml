[package]
name = "clearwave"
version = "0.7.1-dev.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/NullMagic2/Clearwave"
rust-version = "1.88"
description = "Native model loading and portable GPU compute for voice processing"

[lib]
name = "clearwave_apo"
path = "src/apo/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
sha2 = "=0.10.9"
safetensors = { version = "=0.8.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wgpu = { version = "=25.0.2", default-features = false, features = ["vulkan", "wgsl"] }
pollster = "=0.4.0"
bytemuck = "=1.25.2"
half = "=2.7.1"
flate2 = "=1.1.10"
crc32fast = "=1.5.2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", features = ["signal", "poll"] }
gtk = "=0.18.2"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_Media_Audio_Apo", "Win32_System_Pipes", "Win32_System_IO",
    "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Variant",
    "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem",
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_LibraryLoader",
    "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
windows-gui = []

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
